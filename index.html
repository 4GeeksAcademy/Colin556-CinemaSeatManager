<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Seat Manager</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto min-h-screen w-full max-w-6xl p-4 md:p-8">
      <header class="mb-6">
        <h1 class="text-3xl font-bold tracking-tight md:text-4xl">Cinema Seat Manager</h1>
        <p class="mt-2 text-sm text-slate-600 md:text-base">
          8 rows, 10 seats per row. Click seats or use forms to reserve.
        </p>
      </header>

      <section class="grid gap-6 lg:grid-cols-[2fr_1fr]">
        <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:p-6">
          <div class="mb-4 flex items-center justify-between gap-4">
            <h2 class="text-lg font-semibold md:text-xl">Screening Room</h2>
            <p id="seat-counter" class="text-sm font-medium text-slate-700"></p>
          </div>

          <div class="mb-4 rounded-lg bg-slate-900 py-2 text-center text-xs font-semibold tracking-[0.22em] text-slate-100 md:text-sm">
            SCREEN
          </div>

          <div id="seat-grid" class="grid-area" aria-label="Cinema seat layout"></div>
        </article>

        <aside class="space-y-4">
          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:p-5">
            <h3 class="text-base font-semibold">Reserve One Seat</h3>
            <form id="single-seat-form" class="mt-3 space-y-3">
              <div>
                <label for="single-row" class="text-sm font-medium text-slate-700">Row (1-8)</label>
                <input id="single-row" name="row" type="number" min="1" max="8" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-offset-2 focus:ring-2 focus:ring-slate-400" />
              </div>
              <div>
                <label for="single-seat" class="text-sm font-medium text-slate-700">Seat (1-10)</label>
                <input id="single-seat" name="seat" type="number" min="1" max="10" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-offset-2 focus:ring-2 focus:ring-slate-400" />
              </div>
              <button type="submit" class="w-full rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">Reserve Seat</button>
            </form>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:p-5">
            <h3 class="text-base font-semibold">Reserve Multiple Seats</h3>
            <p class="mt-2 text-xs text-slate-600">Format: 1-2, 1-3, 2-5</p>
            <form id="multiple-seat-form" class="mt-3 space-y-3">
              <textarea id="multiple-seats" name="seats" rows="3" required placeholder="1-2, 1-3, 2-5" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-offset-2 focus:ring-2 focus:ring-slate-400"></textarea>
              <button type="submit" class="w-full rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">Reserve Multiple</button>
            </form>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:p-5">
            <h3 class="text-base font-semibold">Utilities</h3>
            <div class="mt-3 grid gap-2">
              <button id="find-adjacent" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">Find 2 Adjacent Seats</button>
              <button id="print-console" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">Print Matrix to Console</button>
            </div>
            <p id="status" class="mt-3 min-h-10 rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-700"></p>
          </section>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
